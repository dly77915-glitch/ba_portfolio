<div class="hero-visual" aria-hidden="true">
  <!--
    Optional hero background video.
    Replace assets/videos/hero-background.mp4 with your compressed MP4.
    Keep assets/images/hero/hero-poster.webp as the fallback/poster image.
  -->
  <video class="hero-visual__video" autoplay muted loop playsinline poster="{{ '/assets/images/hero/hero-poster.webp' | relative_url }}">
    <source src="{{ '/assets/videos/hero-background.mp4' | relative_url }}" type="video/mp4">
  </video>

  <div class="hero-visual__grid"></div>
  <div class="hero-visual__glow hero-visual__glow--blue"></div>
  <div class="hero-visual__glow hero-visual__glow--gold"></div>

  <div class="hero-orbit hero-orbit--one"><span></span></div>
  <div class="hero-orbit hero-orbit--two"><span></span></div>

  <div class="hero-system-card hero-system-card--business"><span>01</span><strong>Analysis</strong></div>
  <div class="hero-system-card hero-system-card--technology"><span>02</span><strong>Modeling</strong></div>
  <div class="hero-system-card hero-system-card--data"><span>03</span><strong>Implementation</strong></div>
  <div class="hero-system-card hero-system-card--design"><span>04</span><strong>Data Logic</strong></div>
</div>
